name: geoflow-laravel

services:
  postgres:
    image: ${PGVECTOR_IMAGE:-pgvector/pgvector:pg16}
    container_name: geoflow-postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE:-geo_flow}
      POSTGRES_USER: ${DB_USERNAME:-geo_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-geo_password}
    ports:
      - "127.0.0.1:${DB_EXPOSE_PORT:-15432}:5432"
    volumes:
      - ${POSTGRES_DATA_DIR:-./docker-data/dev/postgres}:${POSTGRES_CONTAINER_DATA_DIR:-/var/lib/postgresql}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-geo_user} -d ${DB_DATABASE:-geo_flow}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: geoflow-redis
    ports:
      - "127.0.0.1:${REDIS_EXPOSE_PORT:-16379}:6379"
    restart: unless-stopped

  assets:
    image: ${NODE_IMAGE:-node:22-bookworm-slim}
    container_name: geoflow-assets
    working_dir: /var/www/html
    command: ["sh", "-lc", "npm ci --include=dev --no-audit --no-fund && npm run build"]
    volumes:
      - ./:/var/www/html
      - geoflow-node-modules:/var/www/html/node_modules
    restart: "no"

  init:
    image: geoflow-app:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_CLI_IMAGE: ${PHP_CLI_IMAGE:-php:8.4-cli-bookworm}
        COMPOSER_IMAGE: ${COMPOSER_IMAGE:-composer:2}
        PECL_REDIS_VERSION: ${PECL_REDIS_VERSION:-6.3.0}
        PECL_REDIS_URL: ${PECL_REDIS_URL:-https://github.com/phpredis/phpredis/archive/refs/tags/6.3.0.tar.gz}
        COMPOSER_PACKAGIST_MIRROR: ${COMPOSER_PACKAGIST_MIRROR:-}
    container_name: geoflow-init
    working_dir: /var/www/html
    env_file:
      - ./.env
    environment:
      AUTO_FIX_STORAGE_PERMISSIONS: "${AUTO_FIX_STORAGE_PERMISSIONS:-true}"
      GEOFLOW_SECURITY_FRESH_INSTALL_CONFIRMED: "true"
    # 交给 entrypoint 执行自动初始化（生成 APP_KEY / migrate / geoflow:install）
    command: ["true"]
    volumes:
      - ./:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: "no"

  app:
    image: geoflow-app:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_CLI_IMAGE: ${PHP_CLI_IMAGE:-php:8.4-cli-bookworm}
        COMPOSER_IMAGE: ${COMPOSER_IMAGE:-composer:2}
        PECL_REDIS_VERSION: ${PECL_REDIS_VERSION:-6.3.0}
        PECL_REDIS_URL: ${PECL_REDIS_URL:-https://github.com/phpredis/phpredis/archive/refs/tags/6.3.0.tar.gz}
        COMPOSER_PACKAGIST_MIRROR: ${COMPOSER_PACKAGIST_MIRROR:-}
    container_name: geoflow-app
    working_dir: /var/www/html
    environment:
      AUTO_FIX_STORAGE_PERMISSIONS: "false"
      COMPOSER_ON_START: "${COMPOSER_ON_START:-true}"
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "${APP_PORT:-18080}:8080"
    volumes:
      - ./:/var/www/html
    depends_on:
      assets:
        condition: service_completed_successfully
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  queue:
    image: geoflow-app:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_CLI_IMAGE: ${PHP_CLI_IMAGE:-php:8.4-cli-bookworm}
        COMPOSER_IMAGE: ${COMPOSER_IMAGE:-composer:2}
        PECL_REDIS_VERSION: ${PECL_REDIS_VERSION:-6.3.0}
        PECL_REDIS_URL: ${PECL_REDIS_URL:-https://github.com/phpredis/phpredis/archive/refs/tags/6.3.0.tar.gz}
        COMPOSER_PACKAGIST_MIRROR: ${COMPOSER_PACKAGIST_MIRROR:-}
    container_name: geoflow-queue
    working_dir: /var/www/html
    environment:
      AUTO_FIX_STORAGE_PERMISSIONS: "false"
      COMPOSER_ON_START: "${COMPOSER_ON_START:-true}"
    command: ["php", "-d", "memory_limit=256M", "artisan", "queue:work", "redis", "--queue=geoflow,distribution,theme-replication,default", "--sleep=1", "--tries=1", "--timeout=660", "--memory=128", "--max-jobs=100", "--max-time=3600"]
    mem_limit: ${QUEUE_CONTAINER_MEMORY_LIMIT:-384m}
    stop_grace_period: 690s
    volumes:
      - ./:/var/www/html
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  knowledge-queue:
    image: geoflow-app:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_CLI_IMAGE: ${PHP_CLI_IMAGE:-php:8.4-cli-bookworm}
        COMPOSER_IMAGE: ${COMPOSER_IMAGE:-composer:2}
        PECL_REDIS_VERSION: ${PECL_REDIS_VERSION:-6.3.0}
        PECL_REDIS_URL: ${PECL_REDIS_URL:-https://github.com/phpredis/phpredis/archive/refs/tags/6.3.0.tar.gz}
        COMPOSER_PACKAGIST_MIRROR: ${COMPOSER_PACKAGIST_MIRROR:-}
    container_name: geoflow-knowledge-queue
    working_dir: /var/www/html
    environment:
      AUTO_FIX_STORAGE_PERMISSIONS: "false"
      COMPOSER_ON_START: "${COMPOSER_ON_START:-true}"
    command: ["php", "-d", "memory_limit=160M", "artisan", "queue:work", "redis", "--queue=knowledge", "--sleep=1", "--tries=1", "--timeout=210", "--memory=128", "--max-jobs=20", "--max-time=1800"]
    mem_limit: ${KNOWLEDGE_QUEUE_CONTAINER_MEMORY_LIMIT:-256m}
    stop_grace_period: 240s
    volumes:
      - ./:/var/www/html
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  system-update-queue:
    image: geoflow-app:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_CLI_IMAGE: ${PHP_CLI_IMAGE:-php:8.4-cli-bookworm}
        COMPOSER_IMAGE: ${COMPOSER_IMAGE:-composer:2}
        PECL_REDIS_VERSION: ${PECL_REDIS_VERSION:-6.3.0}
        PECL_REDIS_URL: ${PECL_REDIS_URL:-https://github.com/phpredis/phpredis/archive/refs/tags/6.3.0.tar.gz}
        COMPOSER_PACKAGIST_MIRROR: ${COMPOSER_PACKAGIST_MIRROR:-}
    container_name: geoflow-system-update-queue
    working_dir: /var/www/html
    environment:
      AUTO_FIX_STORAGE_PERMISSIONS: "false"
      COMPOSER_ON_START: "${COMPOSER_ON_START:-true}"
    command: ["php", "-d", "memory_limit=256M", "artisan", "queue:work", "redis", "--queue=system-updates", "--sleep=1", "--tries=1", "--timeout=930", "--memory=256", "--max-jobs=10", "--max-time=3600"]
    mem_limit: ${SYSTEM_UPDATE_QUEUE_CONTAINER_MEMORY_LIMIT:-384m}
    stop_grace_period: 960s
    volumes:
      - ./:/var/www/html
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  scheduler:
    image: geoflow-app:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_CLI_IMAGE: ${PHP_CLI_IMAGE:-php:8.4-cli-bookworm}
        COMPOSER_IMAGE: ${COMPOSER_IMAGE:-composer:2}
        PECL_REDIS_VERSION: ${PECL_REDIS_VERSION:-6.3.0}
        PECL_REDIS_URL: ${PECL_REDIS_URL:-https://github.com/phpredis/phpredis/archive/refs/tags/6.3.0.tar.gz}
        COMPOSER_PACKAGIST_MIRROR: ${COMPOSER_PACKAGIST_MIRROR:-}
    container_name: geoflow-scheduler
    working_dir: /var/www/html
    environment:
      AUTO_FIX_STORAGE_PERMISSIONS: "false"
      COMPOSER_ON_START: "${COMPOSER_ON_START:-true}"
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./:/var/www/html
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  reverb:
    image: geoflow-app:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_CLI_IMAGE: ${PHP_CLI_IMAGE:-php:8.4-cli-bookworm}
        COMPOSER_IMAGE: ${COMPOSER_IMAGE:-composer:2}
        PECL_REDIS_VERSION: ${PECL_REDIS_VERSION:-6.3.0}
        PECL_REDIS_URL: ${PECL_REDIS_URL:-https://github.com/phpredis/phpredis/archive/refs/tags/6.3.0.tar.gz}
        COMPOSER_PACKAGIST_MIRROR: ${COMPOSER_PACKAGIST_MIRROR:-}
    container_name: geoflow-reverb
    working_dir: /var/www/html
    environment:
      AUTO_FIX_STORAGE_PERMISSIONS: "false"
      COMPOSER_ON_START: "${COMPOSER_ON_START:-true}"
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "${REVERB_EXPOSE_PORT:-18081}:8080"
    volumes:
      - ./:/var/www/html
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  geoflow-node-modules:
