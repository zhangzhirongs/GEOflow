map $http_host $geoflow_dev_port {
    default $server_port;
    "~:(?<geoflow_dev_host_port>[0-9]+)$" $geoflow_dev_host_port;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 64m;

    location ^~ /internal/ { return 404; }
    location = /_agent_auth {
        internal;
        proxy_pass http://app:8080/internal/agent-identity;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Agent-Original-URI $request_uri;
        proxy_set_header X-Agent-Original-Method $agent_original_method;
    }

    location = /agent {
        return 308 /agent/;
    }

    location ^~ /agent/ {
        set $agent_original_method $request_method;
        auth_request /_agent_auth;
        auth_request_set $agent_identity $upstream_http_x_agent_identity;
        auth_request_set $agent_signature $upstream_http_x_agent_signature;
        proxy_set_header X-Agent-Identity $agent_identity;
        proxy_set_header X-Agent-Signature $agent_signature;
        proxy_pass http://host.docker.internal:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $geoflow_dev_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /agent;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $geoflow_dev_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
